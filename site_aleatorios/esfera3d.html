<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Esfera 3D Giratória</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050510;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }
    canvas { display: block; }
    #info {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.4);
      font-size: 13px;
      pointer-events: none;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">Mova o mouse para interagir com a esfera</div>

<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
if (!gl) { document.body.innerHTML = '<p style="color:white;padding:2rem">WebGL não suportado.</p>'; }

// ── Shaders ──────────────────────────────────────────────────
const vsSource = `
  attribute vec3 aPos;
  attribute vec3 aNormal;
  uniform mat4 uMVP;
  uniform mat4 uModel;
  varying vec3 vNormal;
  varying vec3 vWorldPos;
  void main(){
    vec4 world = uModel * vec4(aPos, 1.0);
    vWorldPos = world.xyz;
    vNormal   = normalize(mat3(uModel) * aNormal);
    gl_Position = uMVP * vec4(aPos, 1.0);
  }
`;

const fsSource = `
  precision highp float;
  varying vec3 vNormal;
  varying vec3 vWorldPos;
  uniform vec3 uCamPos;
  uniform vec3 uLight1;
  uniform vec3 uLight2;
  uniform float uTime;

  // Simple hash for noise
  float hash(vec3 p){ return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453); }

  vec3 baseColor(vec3 n){
    // aurora-like color based on normals + time
    float t = uTime * 0.4;
    vec3 c1 = vec3(0.2, 0.5, 1.0);
    vec3 c2 = vec3(0.8, 0.2, 1.0);
    vec3 c3 = vec3(0.1, 0.9, 0.7);
    float m1 = 0.5 + 0.5*sin(n.y*3.0 + t);
    float m2 = 0.5 + 0.5*cos(n.x*2.5 + t*1.3);
    return mix(mix(c1,c2,m1), c3, m2*0.5);
  }

  vec3 phong(vec3 lightDir, vec3 lightCol, vec3 normal, vec3 viewDir, vec3 base){
    float diff = max(dot(normal, lightDir), 0.0);
    vec3 refl  = reflect(-lightDir, normal);
    float spec = pow(max(dot(viewDir, refl), 0.0), 80.0);
    return base * lightCol * diff + lightCol * spec * 1.5;
  }

  void main(){
    vec3 N = normalize(vNormal);
    vec3 V = normalize(uCamPos - vWorldPos);

    vec3 base = baseColor(N);

    vec3 l1 = normalize(uLight1 - vWorldPos);
    vec3 l2 = normalize(uLight2 - vWorldPos);

    vec3 col = base * 0.08; // ambient
    col += phong(l1, vec3(1.0, 0.85, 0.7), N, V, base);
    col += phong(l2, vec3(0.4, 0.5, 1.0),  N, V, base);

    // Fresnel rim
    float fresnel = pow(1.0 - max(dot(N,V),0.0), 3.0);
    col += fresnel * vec3(0.5, 0.7, 1.0) * 1.2;

    // tone-map
    col = col / (col + vec3(1.0));
    col = pow(col, vec3(0.4545));

    gl_FragColor = vec4(col, 1.0);
  }
`;

// ── Compile shaders ──────────────────────────────────────────
function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER,   vsSource));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSource));
gl.linkProgram(prog);
gl.useProgram(prog);

// ── Sphere geometry ──────────────────────────────────────────
function buildSphere(radius, latBands, lonBands){
  const pos=[], norm=[], idx=[];
  for(let lat=0;lat<=latBands;lat++){
    const theta = lat*Math.PI/latBands;
    const sinT=Math.sin(theta), cosT=Math.cos(theta);
    for(let lon=0;lon<=lonBands;lon++){
      const phi = lon*2*Math.PI/lonBands;
      const x=Math.cos(phi)*sinT, y=cosT, z=Math.sin(phi)*sinT;
      pos.push(radius*x, radius*y, radius*z);
      norm.push(x,y,z);
    }
  }
  for(let lat=0;lat<latBands;lat++){
    for(let lon=0;lon<lonBands;lon++){
      const a=lat*(lonBands+1)+lon;
      const b=a+lonBands+1;
      idx.push(a,b,a+1, b,b+1,a+1);
    }
  }
  return {pos:new Float32Array(pos), norm:new Float32Array(norm), idx:new Uint16Array(idx)};
}

const sphere = buildSphere(1.4, 80, 80);

const posBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
gl.bufferData(gl.ARRAY_BUFFER, sphere.pos, gl.STATIC_DRAW);

const normBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, normBuf);
gl.bufferData(gl.ARRAY_BUFFER, sphere.norm, gl.STATIC_DRAW);

const idxBuf = gl.createBuffer();
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, sphere.idx, gl.STATIC_DRAW);

const aPos    = gl.getAttribLocation(prog,'aPos');
const aNormal = gl.getAttribLocation(prog,'aNormal');
const uMVP    = gl.getUniformLocation(prog,'uMVP');
const uModel  = gl.getUniformLocation(prog,'uModel');
const uCamPos = gl.getUniformLocation(prog,'uCamPos');
const uLight1 = gl.getUniformLocation(prog,'uLight1');
const uLight2 = gl.getUniformLocation(prog,'uLight2');
const uTime   = gl.getUniformLocation(prog,'uTime');

// ── Math helpers ─────────────────────────────────────────────
function mat4(){return new Float32Array(16);}
function identity(m){m.fill(0);m[0]=m[5]=m[10]=m[15]=1;return m;}

function multiply(a,b){
  const r=mat4();
  for(let i=0;i<4;i++) for(let j=0;j<4;j++){
    let s=0; for(let k=0;k<4;k++) s+=a[i*4+k]*b[k*4+j];
    r[i*4+j]=s;
  }
  return r;
}

function perspective(fov,asp,near,far){
  const m=mat4(); m.fill(0);
  const f=1/Math.tan(fov/2);
  m[0]=f/asp; m[5]=f;
  m[10]=(far+near)/(near-far); m[11]=-1;
  m[14]=2*far*near/(near-far);
  return m;
}

function lookAt(eye,center,up){
  const f=norm3(sub3(center,eye));
  const s=norm3(cross3(f,up));
  const u=cross3(s,f);
  const m=mat4(); identity(m);
  m[0]=s[0];m[4]=s[1];m[8]=s[2];
  m[1]=u[0];m[5]=u[1];m[9]=u[2];
  m[2]=-f[0];m[6]=-f[1];m[10]=-f[2];
  m[12]=-dot3(s,eye); m[13]=-dot3(u,eye); m[14]=dot3(f,eye);
  return m;
}

function rotX(a){const m=mat4();identity(m);m[5]=Math.cos(a);m[6]=-Math.sin(a);m[9]=Math.sin(a);m[10]=Math.cos(a);return m;}
function rotY(a){const m=mat4();identity(m);m[0]=Math.cos(a);m[2]=Math.sin(a);m[8]=-Math.sin(a);m[10]=Math.cos(a);return m;}

function sub3(a,b){return [a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
function dot3(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function cross3(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
function norm3(v){const l=Math.sqrt(dot3(v,v));return[v[0]/l,v[1]/l,v[2]/l];}

// ── Mouse ─────────────────────────────────────────────────────
let mouseX=0, mouseY=0;
document.addEventListener('mousemove', e=>{
  mouseX = (e.clientX/window.innerWidth  - 0.5) * 2;
  mouseY = (e.clientY/window.innerHeight - 0.5) * 2;
});

// touch
document.addEventListener('touchmove', e=>{
  const t=e.touches[0];
  mouseX = (t.clientX/window.innerWidth  - 0.5) * 2;
  mouseY = (t.clientY/window.innerHeight - 0.5) * 2;
},{passive:true});

// ── Resize ────────────────────────────────────────────────────
function resize(){
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  gl.viewport(0,0,canvas.width,canvas.height);
}
window.addEventListener('resize', resize);
resize();

// ── Render loop ───────────────────────────────────────────────
let autoYaw = 0;
let prevT = 0;

function frame(t){
  requestAnimationFrame(frame);
  const dt = (t - prevT) * 0.001; prevT = t;
  const time = t * 0.001;

  autoYaw += dt * 0.4;

  // blend auto rotation with mouse influence
  const yaw   = autoYaw + mouseX * 1.2;
  const pitch = mouseY * 0.8;

  const model = multiply(rotX(-pitch), rotY(yaw));

  const eye    = [0, 0, 4.5];
  const view   = lookAt(eye, [0,0,0], [0,1,0]);
  const proj   = perspective(Math.PI/4, canvas.width/canvas.height, 0.1, 100);
  const mvp    = multiply(proj, multiply(view, model));

  gl.clearColor(0.02, 0.02, 0.06, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);

  gl.uniformMatrix4fv(uMVP,   false, mvp);
  gl.uniformMatrix4fv(uModel, false, model);
  gl.uniform3fv(uCamPos, eye);
  gl.uniform3fv(uLight1, [4*Math.cos(time*0.7), 3, 4*Math.sin(time*0.7)]);
  gl.uniform3fv(uLight2, [-3, -2, 3]);
  gl.uniform1f(uTime, time);

  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);

  gl.bindBuffer(gl.ARRAY_BUFFER, normBuf);
  gl.enableVertexAttribArray(aNormal);
  gl.vertexAttribPointer(aNormal, 3, gl.FLOAT, false, 0, 0);

  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
  gl.drawElements(gl.TRIANGLES, sphere.idx.length, gl.UNSIGNED_SHORT, 0);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
