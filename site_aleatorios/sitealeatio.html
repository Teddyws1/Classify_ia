<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classify IA - Central de Ferramentas</title>

    <script src="site.aleatorio.js"></script>
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>

    <link rel="stylesheet" href="css_site aleatorio.css" />
  </head>
  <body>
    <div id="globalOverlay" class="overlay" onclick="closeAllOverlays()"></div>

    <button id="sidebarToggle" onclick="toggleSidebar()">
      <ion-icon name="menu-outline"></ion-icon>
    </button>

    <aside class="sidebar" id="mainSidebar">
      <h2 style="color: var(--accent); margin-bottom: 20px; font-style: italic">
        Classify IA
      </h2>

      <button id="Voltar" onclick="goBack()">
        <ion-icon name="arrow-back-outline"></ion-icon> Voltar
      </button>
      <button class="sidebar-btn" onclick="openModal('updatesModal')">
        <ion-icon name="newspaper-outline"></ion-icon> Atualizações
      </button>
      <button class="Explorar" onclick="openModal('randomSitesModal')">
        <ion-icon name="shuffle-outline"></ion-icon> Explorar Sites
      </button>
      <button id="themeToggle" class="themeToggle" onclick="toggleTheme()">
        <ion-icon name="sunny-outline" id="theme-icon"></ion-icon>
        <span>Tema</span>
      </button>
      <div class="versaobox">
        <span>Versão</span>
        <strong>v 5.10.9 beta</strong>
      </div>
    </aside>

    <header class="main-header">
      <div class="title">
        <h1>Classify IA</h1>
        <p>As melhores ferramentas em um só lugar</p>
      </div>
      <div class="search-box">
        <ion-icon name="search-outline"></ion-icon>
        <input
          type="text"
          id="mainSearch"
          placeholder="Pesquisar ferramenta..."
          onkeyup="filterMainCards()"
        />
      </div>
    </header>

    <div class="tabs-header">
      <button class="tab-btn active" onclick="switchTab('recomendados')">
        Recomendados
      </button>
      <button class="tab-btn" onclick="switchTab('melhores')">Melhores</button>
      <button class="tab-btn" onclick="switchTab('editar')">editar</button>
      <button class="tab-btn" onclick="switchTab('ferramentas PDF')">
        ferramentas PDF
      </button>
      <button class="tab-btn" onclick="switchTab('livros pdfs')">
        livros pdfs
      </button>
    </div>
    <div class="grid-container">
      <div class="grid" id="cardsContainer"></div>
    </div>

    <div id="shareModal" class="modal-box">
      <div class="modal-header">
        <h2><ion-icon name="share-social"></ion-icon> Compartilhar</h2>
        <button class="btn-close-modal" onclick="closeAllOverlays()">
          <ion-icon name="close"></ion-icon>
        </button>
      </div>
      <p id="shareText" style="color: var(--muted); margin-bottom: 20px">
        Selecione a rede:
      </p>
      <div class="share-grid">
        <button
          class="btn-share-action whatsapp"
          onclick="shareAction('whatsapp')"
        >
          <ion-icon name="logo-whatsapp"></ion-icon> WhatsApp
        </button>
        <button
          class="btn-share-action facebook"
          onclick="shareAction('facebook')"
        >
          <ion-icon name="logo-facebook"></ion-icon> Facebook
        </button>
        <button
          class="btn-share-action instagram"
          onclick="shareAction('instagram')"
        >
          <ion-icon name="logo-instagram"></ion-icon> Instagram
        </button>
        <button class="btn-share-action tiktok" onclick="shareAction('tiktok')">
          <ion-icon name="logo-tiktok"></ion-icon> TikTok
        </button>
        <button class="btn-share-action copy" onclick="shareAction('copy')">
          <ion-icon name="copy-outline"></ion-icon> Copiar Link
        </button>
      </div>
    </div>

    <div id="randomSitesModal" class="modal-box random-sites-box">
      <div class="modal-header">
        <h2><ion-icon name="planet"></ion-icon> Explorar Sites</h2>
        <button class="btn-close-modal" onclick="closeAllOverlays()">
          <ion-icon name="close"></ion-icon>
        </button>
      </div>
      <input
        type="text"
        placeholder="Buscar site na lista..."
        id="randomSearch"
        onkeyup="filterRandom()"
        class="modal-input"
      />
      <div class="random-grid" id="randomGrid"></div>
    </div>

    <div id="updatesModal" class="modal-box">
      <div class="modal-header">
        <h2><ion-icon name="notifications"></ion-icon> Notas</h2>
        <button class="btn-close-modal" onclick="closeAllOverlays()">
          <ion-icon name="close"></ion-icon>
        </button>
      </div>
      <ul class="update-list" id="updatesList"></ul>
    </div>

    <div id="toast">
      <ion-icon name="checkmark-circle"></ion-icon>
      <span id="toastMsg">Sucesso!</span>
    </div>
  </body>
</html>
